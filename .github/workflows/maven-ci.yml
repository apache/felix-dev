name: Github CI Build

on:
  push:
    branches: [ "master" ]
    paths:
      - 'scr/**'
      - 'http/**'
      - 'tools/maven-bundle-plugin/**'
      - 'tools/osgicheck-maven-plugin/**'
      - 'log/**'
      - 'webconsole/**'
      - 'framework/**'
      - 'gogo/**'
      - 'framework.tck/**'
      - 'main/**'
      - 'utils/**'
      - 'connect/**'
      - 'resolver/**'
      - 'bundlerepository/**'
      - 'log.extension/**'
      - 'examples/**'
      - 'configadmin/**'
  pull_request:
    branches: [ "master", "feature/**", "maintenance/**" ]
    paths:
      - 'scr/**'
      - 'http/**'
      - 'tools/maven-bundle-plugin/**'
      - 'tools/osgicheck-maven-plugin/**'
      - 'webconsole/**'
      - 'log/**'
      - 'framework/**'
      - 'gogo/**'
      - 'framework.tck/**'
      - 'main/**'
      - 'utils/**'
      - 'connect/**'
      - 'resolver/**'
      - 'bundlerepository/**'
      - 'log.extension/**'
      - 'examples/**'
      - 'configadmin/**'

# Cancel superseded runs when a branch is pushed again. github.head_ref is only set
# for pull_request events, so pushes to master fall back to the unique run_id and are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17,21,25,27]
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    - name: Set up Maven
      uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
      with:
        maven-version: 3.9.9
    - name: Check which subproject changed and build affected ones
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
      id: changes
      with:
        filters: |
          scr:
            - 'scr/**'
          http:
            - 'http/**'
          maven-bundle-plugin:
            - 'tools/maven-bundle-plugin/**'
          maven-osgicheck-plugin:
            - 'tools/osgicheck-maven-plugin/**'
          webconsole:
            - 'webconsole/**'
          log:
            - 'log/**'
          framework:
            - 'framework/**'
            - 'framework.tck/**'
          gogo:
            - 'gogo/**'
          main:
            - 'main/**'
          configadmin:
            - 'configadmin/**'
          utils:
            - 'utils/**'
          connect:
            - 'connect/**'
          resolver:
            - 'resolver/**'
          bundlerepository:
            - 'bundlerepository/**'
          logextension:
            - 'log.extension/**'
          examples:
            - 'examples/**'
    - name: Felix Log
      if: steps.changes.outputs.log == 'true'
      run: mvn -B -V -Dstyle.color=always --file log/pom.xml clean verify
    # Several modules pin released Felix bundles as test-scoped dependencies so that
    # they still build on their own. Each such pin is a property, which the steps below
    # override with the version built from this repository, so the tests exercise the
    # code being changed rather than the last release. A producer is therefore built and
    # installed whenever it or one of its consumers changed. See FELIX-6870.
    - name: Resolve the versions built in this repository
      if: steps.changes.outputs.framework == 'true' || steps.changes.outputs.http == 'true' || steps.changes.outputs.configadmin == 'true' || steps.changes.outputs.scr == 'true' || steps.changes.outputs.gogo == 'true' || steps.changes.outputs.utils == 'true' || steps.changes.outputs.resolver == 'true'
      run: |
        record() {
          echo "$1=$2" >> "$GITHUB_ENV"
          echo "$1 = $2"
        }
        for module in framework configadmin utils; do
          record "$(echo "$module" | tr 'a-z' 'A-Z')_VERSION"             "$(mvn -B -q --file "$module/pom.xml" help:evaluate -Dexpression=project.version -DforceStdout)"
        done
        # gogo-parent is not published anywhere, so these only resolve inside the gogo reactor.
        for module in command runtime shell jline; do
          record "GOGO_$(echo "$module" | tr 'a-z' 'A-Z')_VERSION"             "$(mvn -B -q --file gogo/pom.xml -pl "$module" help:evaluate -Dexpression=project.version -DforceStdout)"
        done
    - name: Felix Framework
      if: steps.changes.outputs.framework == 'true' || steps.changes.outputs.http == 'true' || steps.changes.outputs.configadmin == 'true' || steps.changes.outputs.scr == 'true' || steps.changes.outputs.gogo == 'true'
      run: mvn -B -V -Dstyle.color=always --file framework/pom.xml clean install
    - name: Felix Config Admin
      if: steps.changes.outputs.configadmin == 'true' || steps.changes.outputs.scr == 'true'
      run: mvn -B -V -Dstyle.color=always --file configadmin/pom.xml clean install "-Dfelix.framework.version=$FRAMEWORK_VERSION"
    - name: Felix SCR
      if: steps.changes.outputs.scr == 'true'
      run: mvn -B -V -Dstyle.color=always --file scr/pom.xml clean verify "-Dfelix.framework.version=$FRAMEWORK_VERSION" "-Dfelix.configadmin.version=$CONFIGADMIN_VERSION"
    - name: Felix HTTP
      if: steps.changes.outputs.http == 'true'
      run: mvn -B -V -Dstyle.color=always "-Dit.test=!MissingWebsocketDependenciesIT" --file http/pom.xml clean install verify "-Dmaven.repo.local=/home/runner/.m2/repository/" "-Dfelix.framework.version=$FRAMEWORK_VERSION"
    - name: Felix Maven bundle plugin
      if: steps.changes.outputs.maven-bundle-plugin == 'true'
      run: mvn -B -V -Dstyle.color=always --file tools/maven-bundle-plugin/pom.xml clean install verify
    - name: Felix Maven OSGi check plugin
      if: steps.changes.outputs.maven-osgicheck-plugin == 'true'
      run: mvn -B -V -Dstyle.color=always --file tools/osgicheck-maven-plugin/pom.xml clean install verify
    - name: Felix Webconsole
      if: steps.changes.outputs.webconsole == 'true'
      run: mvn -B -V -Dstyle.color=always --file webconsole/pom.xml clean install verify
    - name: OSGi-TCK Framework
      if: steps.changes.outputs.framework == 'true'
      run: mvn -B -V -Dstyle.color=always --file framework.tck/pom.xml clean verify
    - name: Felix Main
      if: steps.changes.outputs.main == 'true'
      run: mvn -B -V -Dstyle.color=always --file main/pom.xml clean verify
    - name: Felix Gogo Shell
      if: steps.changes.outputs.gogo == 'true'
      run: mvn -B -V -Dstyle.color=always --file gogo/pom.xml clean verify "-Dfelix.gogo.command.version=$GOGO_COMMAND_VERSION" "-Dfelix.gogo.runtime.version=$GOGO_RUNTIME_VERSION" "-Dfelix.gogo.shell.version=$GOGO_SHELL_VERSION" "-Dfelix.gogo.jline.version=$GOGO_JLINE_VERSION" "-Dfelix.framework.version=$FRAMEWORK_VERSION"
    - name: Felix utils
      if: steps.changes.outputs.utils == 'true' || steps.changes.outputs.resolver == 'true'
      run: mvn -B -V -Dstyle.color=always --file utils/pom.xml clean install
    - name: Felix connect
      if: steps.changes.outputs.connect == 'true'
      run: mvn -B -V -Dstyle.color=always --file connect/pom.xml clean verify
    - name: Felix resolver
      if: steps.changes.outputs.resolver == 'true'
      run: mvn -B -V -Dstyle.color=always --file resolver/pom.xml clean verify "-Dfelix.utils.version=$UTILS_VERSION"
    - name: Felix bundlerepository
      if: steps.changes.outputs.bundlerepository == 'true'
      run: mvn -B -V -Dstyle.color=always --file bundlerepository/pom.xml clean verify
    - name: Felix log.extension
      if: steps.changes.outputs.logextension == 'true'
      run: mvn -B -V -Dstyle.color=always --file log.extension/pom.xml clean verify
    - name: Felix examples
      if: steps.changes.outputs.examples == 'true'
      run: mvn -B -V -Dstyle.color=always --file examples/pom.xml clean verify
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-jdk${{ matrix.java }}
        if-no-files-found: warn
        path: |
          ${{ github.workspace }}/**/target/surefire-reports/*.xml
          ${{ github.workspace }}/**/target/failsafe-reports/*.xml
          ${{ github.workspace }}/**/target/test-reports/tck/*.xml

